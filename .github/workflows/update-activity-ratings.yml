name: Update Activity Ratings

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  update-ratings:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update activity ratings
        env:
          PR001_URL: "https://script.google.com/macros/s/AKfycbx_mDzK93rJo_4NVPRBIYxQFRvatd9c2QEHpJSRx_y7BafuAPWIU1MryUVJ50MfOk5Z4w/exec"
          PR002_URL: "https://script.google.com/macros/s/AKfycbyi6os1IJG1t92GvHucW6VEAJGSiEhlzkGB9chR6e2vuohXYDecEtv-2a46DiufOtgn/exec"
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import urllib.request
          from pathlib import Path

          BASE = Path("Course Materials")
          INDEX = BASE / "Readme.md"

          activities = [
              {
                  "id": "PR-001",
                  "url": os.environ["PR001_URL"],
                  "readme": BASE / "PR-001" / "Readme.md",
              },
              {
                  "id": "PR-002",
                  "url": os.environ["PR002_URL"],
                  "readme": BASE / "PR-002" / "Readme.md",
              },
          ]

          def fetch(url):
              with urllib.request.urlopen(url) as response:
                  return json.load(response)

          def public_rating(data):
              responses = int(data["responses"])
              rating = str(data["rating"])
              stars = str(data["stars"])

              if "#" in rating or "#" in stars:
                  raise RuntimeError(
                      f'{data["activity"]}: spreadsheet returned an error.'
                  )

              if responses < 10:
                  return "Not yet rated"

              return f"{stars} {rating} / 5"

          def update_activity_readme(path, data):
              responses = int(data["responses"])
              rating = public_rating(data)

              if responses < 10:
                  block = (
                      "<!-- RATING_START -->\n"
                      "**Not yet rated**  \n"
                      f"**Responses:** {responses}\n"
                      "<!-- RATING_END -->"
                  )
              else:
                  block = (
                      "<!-- RATING_START -->\n"
                      f"**{rating}**  \n"
                      f"**Responses:** {responses}\n"
                      "<!-- RATING_END -->"
                  )

              text = path.read_text(encoding="utf-8")

              text, count = re.subn(
                  r"<!-- RATING_START -->.*?<!-- RATING_END -->",
                  block,
                  text,
                  flags=re.S,
              )

              if count != 1:
                  raise RuntimeError(
                      f"{path}: rating block not found."
                  )

              path.write_text(text, encoding="utf-8")

          def update_index_row(text, activity_id, data):
              lines = text.splitlines()
              found = False

              for i, line in enumerate(lines):
                  if (
                      line.startswith("|")
                      and f"[{activity_id} —" in line
                  ):
                      cells = [
                          c.strip()
                          for c in line.split("|")[1:-1]
                      ]

                      if len(cells) != 6:
                          raise RuntimeError(
                              f"{activity_id}: expected 6 table columns."
                          )

                      cells[3] = public_rating(data)
                      cells[4] = str(int(data["responses"]))

                      lines[i] = (
                          "| " + " | ".join(cells) + " |"
                      )

                      found = True
                      break

              if not found:
                  raise RuntimeError(
                      f"{activity_id}: activity table row not found."
                  )

              return "\n".join(lines) + "\n"

          index_text = INDEX.read_text(encoding="utf-8")

          for activity in activities:
              data = fetch(activity["url"])

              print(activity["id"], data)

              if data.get("activity") != activity["id"]:
                  raise RuntimeError(
                      f'Endpoint mismatch for {activity["id"]}.'
                  )

              update_activity_readme(
                  activity["readme"],
                  data
              )

              index_text = update_index_row(
                  index_text,
                  activity["id"],
                  data
              )

          INDEX.write_text(index_text, encoding="utf-8")

          print("All activity ratings updated successfully.")
          PY

      - name: Commit rating changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "Course Materials/PR-001/Readme.md"
          git add "Course Materials/PR-002/Readme.md"
          git add "Course Materials/Readme.md"

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Update activity ratings"
          git push
